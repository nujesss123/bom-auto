name: Sync monday.com photo links
on:
  schedule:
    - cron: '0 21 * * *'       # 매일 06:00 KST — 전체 갱신
    - cron: '30 3 * * 1-5'     # 평일 12:30 KST — 전체 갱신 (SAP BOM 자동 추출과 같은 시각)
    - cron: '0 2-9 * * 1-5'    # 평일 11:00~18:00 KST 매시 정각 — 증분 갱신(변경분만, 기존 이력 유지; 생산업체 표는 매번 새로 집계)
  workflow_dispatch:
    inputs:
      mode:
        description: '갱신 방식'
        type: choice
        default: incremental
        options: [incremental, full]
permissions:
  contents: write
concurrency:
  group: monday-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build monday_map.json
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          # 보드 번호를 콤마로 나열 (추가/삭제 시 여기만 수정)
          MONDAY_BOARD_IDS: '4057650308, 7311969215, 4485989214, 3106368464, 3133983085, 8091356464, 4470968685'
          MONDAY_ACCOUNT: 'spigen'
          # 최종 도안이 들어있는 파일 컬럼 제목들(콤마 구분, 공백/대소문자 무시). 없는 보드는 모든 파일 컬럼+카드 첨부파일을 읽음
          MONDAY_FILES_COLUMN: '최종 도안, 최종 도안 파일'
          # 06:00·12:30 KST 스케줄 = full, 그 외 스케줄 = incremental, 수동 실행 = 선택값
          MONDAY_MODE: ${{ github.event_name == 'schedule' && ((github.event.schedule == '0 21 * * *' || github.event.schedule == '30 3 * * 1-5') && 'full' || 'incremental') || (github.event.inputs.mode || 'incremental') }}
        run: python sync_monday.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monday_map.json
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 건너뜀"
          else
            git commit -m "자동 동기화: 먼데이닷컴 도안 링크"
            git pull --rebase origin main || true
            git push
          fi

name: Sync monday.com photo links
on:
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00 (한국시간)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build monday_map.json
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          # 보드 번호를 콤마로 나열 (예: '4057650308, 1234567890')
          MONDAY_BOARD_IDS: '4057650308'
          MONDAY_ACCOUNT: 'spigen'
          # 파일 컬럼 제목(여러 개면 콤마, 공백/대소문자 무시)
          MONDAY_FILES_COLUMN: '최종 도안'
        run: python sync_monday.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monday_map.json
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 건너뜀"
          else
            git commit -m "자동 동기화: 먼데이닷컴 도안 링크"
            git push
          fi
